definitions:
  environment_vars: &checkpoint_env
    vars:
      XCODE_PROJECT: "TiinverSwift.xcodeproj"
      XCODE_SCHEME: "TiinverSwift"
    xcode: latest

workflows:
  checkpoint-build:
    name: Checkpoint — compilation seule (pas de signature, pas de déploiement)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      <<: *checkpoint_env
      groups:
        # Groupe de variables d'environnement à créer dans Codemagic (Team settings →
        # Environment variables) : GOOGLE_SERVICE_INFO_PLIST_BASE64 doit y être défini,
        # marqué "Secure", et provient de `certutil -encode Resources/GoogleService-Info.plist -`
        # (ou `base64 -i Resources/GoogleService-Info.plist`) — voir MIGRATION_PROGRESS.md,
        # Checkpoint 1. Le fichier réel n'est PAS committé (voir .gitignore).
        - firebase_ios_secrets
    scripts:
      - name: Installer XcodeGen
        script: |
          brew list xcodegen &>/dev/null || brew install xcodegen

      - name: Décoder GoogleService-Info.plist depuis le secret d'environnement
        script: |
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
            echo "ERREUR : la variable d'environnement GOOGLE_SERVICE_INFO_PLIST_BASE64 n'est pas définie."
            echo "À configurer dans Codemagic : Team settings > Environment variables > groupe 'firebase_ios_secrets'."
            exit 1
          fi
          mkdir -p Resources
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > Resources/GoogleService-Info.plist
          plutil -lint Resources/GoogleService-Info.plist

      - name: xcodegen generate
        script: |
          xcodegen generate

      - name: Install Metal Toolchain
        script: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Résoudre les dépendances Swift Package Manager
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build simulateur — vérification de compilation uniquement, sans signature
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

    # Volontairement AUCUNE section `publishing:` ni `artifacts:` — ce workflow sert uniquement
    # à valider le Checkpoint 1 (MIGRATION_PROGRESS.md) : "les ~50 fichiers Swift écrits
    # compilent-ils réellement ?". Pas de signature, pas d'archive, pas d'envoi TestFlight/App
    # Store Connect à ce stade du portage — voir la "Règle de compilation par checkpoint" dans
    # MIGRATION_PROGRESS.md pour la suite (Checkpoint 2 après les modules 7-12, etc.).

  visual-smoke-test:
    name: Test visuel automatisé — captures d'écran simulateur (premier écran/onboarding uniquement)
    # Workflow SÉPARÉ de `checkpoint-build`, ne le modifie pas et ne dépend pas de lui — build son
    # propre binaire simulateur, PAS de signature. But : donner un premier retour VISUEL (l'app
    # lancée, écrans atteignables sans interaction) en attendant un accès à un vrai device via
    # compte Apple Developer payant — voir MIGRATION_PROGRESS.md, section "Premier test visuel
    # automatisé (simulateur Codemagic)". Ne remplace PAS un test manuel réel : capture uniquement
    # ce qui est atteignable sans toucher l'écran (splash → routeur racine → connexion/onboarding),
    # aucune interaction (tap/saisie) n'est simulée ici.
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      <<: *checkpoint_env
      groups:
        - firebase_ios_secrets
    scripts:
      - name: Installer XcodeGen
        script: |
          brew list xcodegen &>/dev/null || brew install xcodegen

      - name: Décoder GoogleService-Info.plist depuis le secret d'environnement
        script: |
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
            echo "ERREUR : la variable d'environnement GOOGLE_SERVICE_INFO_PLIST_BASE64 n'est pas définie."
            echo "À configurer dans Codemagic : Team settings > Environment variables > groupe 'firebase_ios_secrets'."
            exit 1
          fi
          mkdir -p Resources
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > Resources/GoogleService-Info.plist
          plutil -lint Resources/GoogleService-Info.plist
          # Requis ici (pas seulement pour la compilation) : `FirebaseApp.configure()`
          # (App/AppDelegate.swift) plante au lancement si ce fichier est absent — sans lui, ce
          # workflow ne produirait que des captures d'un crash immédiat, pas l'écran de connexion.

      - name: Vérifier la présence réelle du plist décodé sur disque (avant xcodegen generate)
        script: |
          # Diagnostic (2026-08-13, suite) — le fichier reste absent du bundle .app malgré la
          # correction project.yml précédente (entrée resources: dédiée). Étape 1 de
          # l'investigation demandée : confirmer avec preuve (taille réelle, pas supposée) que le
          # fichier existe bien sur disque à l'instant précis où `xcodegen generate` va scanner les
          # resources — avant de chercher plus loin.
          ls -la Resources/GoogleService-Info.plist
          echo "Taille en octets : $(wc -c < Resources/GoogleService-Info.plist)"
          echo "Répertoire de travail courant : $(pwd)"

      - name: xcodegen generate
        script: |
          xcodegen generate

      - name: Vérifier que GoogleService-Info.plist apparaît dans project.pbxproj généré
        script: |
          # Étape 3 de l'investigation demandée : XcodeGen résout les chemins de resources au
          # moment de LA GÉNÉRATION (cette étape), pas au moment du build — si l'entrée
          # n'apparaît pas ici dans project.pbxproj, le problème est dans project.yml/XcodeGen,
          # PAS dans xcodebuild ni dans le simulateur (étapes suivantes, hors de cause dans ce cas).
          echo "--- Recherche de GoogleService-Info dans $XCODE_PROJECT/project.pbxproj ---"
          grep -A3 "GoogleService-Info" "$XCODE_PROJECT/project.pbxproj" || echo "AUCUNE occurrence de GoogleService-Info dans project.pbxproj — XcodeGen ne l'a PAS inclus à la génération, malgré l'entrée resources: dédiée dans project.yml."

      - name: Install Metal Toolchain
        script: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Résoudre les dépendances Swift Package Manager
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build simulateur (avec derivedDataPath fixe pour retrouver le .app ensuite)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Vérifier que GoogleService-Info.plist est bien copié dans le bundle .app
        script: |
          # Ajouté 2026-08-13 suite au crash Firebase confirmé par les logs du run précédent
          # (`FirebaseApp.configure()` ne trouvait pas ce fichier au premier lancement réel — voir
          # `project.yml`, section `resources:`, pour la correction appliquée : entrée dédiée
          # `Resources/GoogleService-Info.plist`). **Toujours en échec après cette correction
          # (2026-08-13, suite)** — étape 4 de l'investigation demandée : à lire EN COMBINAISON avec
          # les 2 étapes de diagnostic ajoutées plus haut (présence sur disque avant generate,
          # présence dans project.pbxproj après generate). Si CE step échoue mais que
          # "GoogleService-Info" apparaissait bien dans project.pbxproj : le problème est côté
          # xcodebuild/exécution de la phase Copy Bundle Resources, PAS côté project.yml — sinon
          # (absent du pbxproj dès la génération), le problème reste côté project.yml/XcodeGen.
          # Vérification placée ICI, juste après le build et
          # AVANT de démarrer/installer/lancer le simulateur, pour échouer vite en cas de régression
          # — pas besoin d'attendre tout le cycle boot/install/launch/captures pour le savoir.
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData/Build/Products" -maxdepth 2 -name "TiinverSwift.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "ERREUR : TiinverSwift.app introuvable sous $CM_BUILD_DIR/DerivedData/Build/Products"
            exit 1
          fi
          echo "Recherche de GoogleService-Info.plist dans $APP_PATH :"
          FOUND=$(find "$APP_PATH" -name "GoogleService-Info.plist")
          if [ -z "$FOUND" ]; then
            echo "ERREUR : GoogleService-Info.plist absent du bundle .app construit — le crash Firebase au lancement (FirebaseApp.configure()) va se reproduire. Voir project.yml, section resources:."
            exit 1
          fi
          echo "OK, trouvé : $FOUND"

      - name: Choisir un simulateur iPhone récent disponible (iPhone 15 si présent, sinon le plus récent)
        script: |
          # Le runner Codemagic (`xcode: latest`) ne garantit pas la présence exacte d'"iPhone 15"
          # d'une image à l'autre — sélection dynamique plutôt qu'un nom codé en dur, pour ne pas
          # faire échouer ce workflow silencieusement si Apple renomme/retire un modèle par défaut.
          DEVICE_UDID=$(python3 - <<'PY'
          import json, subprocess, sys

          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          data = json.loads(raw)

          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))

          if not candidates:
              sys.exit("Aucun simulateur iPhone disponible sur ce runner.")

          preferred = [c for c in candidates if c[1] == "iPhone 15"]
          pool = preferred if preferred else candidates
          pool.sort(key=lambda c: c[0])  # identifiants de runtime iOS, tri croissant par version
          runtime, name, udid = pool[-1]
          print(f"Simulateur choisi : {name} ({runtime})", file=sys.stderr)
          print(udid)
          PY
          )
          echo "DEVICE_UDID=$DEVICE_UDID" >> $CM_ENV

      - name: Démarrer le simulateur, installer et lancer l'app
        script: |
          # Chemin ABSOLU identique à celui utilisé par l'étape de capture ci-dessous — créé ici
          # aussi car cette étape y écrit également ses propres fichiers de diagnostic.
          SCREENSHOT_DIR="$CM_BUILD_DIR/smoke_test_screenshots"
          mkdir -p "$SCREENSHOT_DIR"

          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData/Build/Products" -maxdepth 2 -name "TiinverSwift.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "ERREUR : TiinverSwift.app introuvable sous $CM_BUILD_DIR/DerivedData/Build/Products"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"

          # DIAGNOSTIC (2026-08-13) — les 8 captures du run précédent montraient toutes le
          # springboard, identiques entre elles : l'app ne s'est jamais affichée à l'écran, soit
          # parce que le launch n'a jamais réellement démarré le bon binaire, soit parce qu'elle a
          # crashé immédiatement. Lit le bundle ID ET l'exécutable RÉELLEMENT embarqués dans le
          # .app construit plutôt que de supposer "com.tiinver.ios"/"TiinverSwift" — un décalage
          # silencieux ici expliquerait exactement ce symptôme (`xcrun simctl launch` réussit
          # techniquement dès que la requête est acceptée par launchd, même si l'app ciblée
          # n'existe pas ou crashe l'instant d'après — un exit code 0 ne prouve rien à lui seul).
          BUILT_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          BUILT_EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          echo "Bundle ID réel du .app construit : $BUILT_BUNDLE_ID (attendu : com.tiinver.ios)"
          echo "Exécutable réel du .app construit : $BUILT_EXECUTABLE"
          if [ "$BUILT_BUNDLE_ID" != "com.tiinver.ios" ]; then
            echo "ATTENTION : bundle ID construit différent de com.tiinver.ios — utilisé quand même ci-dessous (valeur réelle), pas la valeur supposée."
          fi

          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          echo "xcrun simctl install exit code : $?"

          # Démarre la capture des logs système AVANT le launch, pas après, pour ne rater aucun
          # message des toutes premières millisecondes (init Firebase/Core Data, etc.) — filtré sur
          # le nom réel de l'exécutable, tourne en arrière-plan pendant la fenêtre de diagnostic
          # ci-dessous puis est arrêté explicitement.
          LOG_FILE="$SCREENSHOT_DIR/simulator_log.txt"
          xcrun simctl spawn "$DEVICE_UDID" log stream --level debug --style compact \
            --predicate "process == \"$BUILT_EXECUTABLE\"" > "$LOG_FILE" 2>&1 &
          LOG_PID=$!

          # `SIMCTL_CHILD_<VAR>` : mécanisme RÉEL de `simctl` (vérifié contre un fil de discussion
          # Apple Developer Forums avant utilisation, pas deviné) pour propager une variable
          # d'environnement au process lancé DANS le simulateur — le préfixe `SIMCTL_CHILD_` est
          # retiré par `simctl`, l'app reçoit `SMOKE_TEST_MODE=1` tel quel. Lu par
          # `App/AppDelegate.swift` (`didFinishLaunchingWithOptions`) pour sauter la demande de
          # permission notifications, dont la boîte de dialogue système bloquait tout le reste de
          # l'écran et empêchait ce smoke-test passif (aucune interaction simulée, par conception)
          # d'atteindre le premier écran réel de l'app (voir MIGRATION_PROGRESS.md — 2 approches
          # évaluées, celle-ci retenue : le boot headless de ce workflow, `simctl boot` sans jamais
          # ouvrir Simulator.app, n'a pas de fenêtre GUI réelle sur laquelle une automation
          # AppleScript/System Events pourrait cliquer, et `idb` aurait introduit une dépendance CI
          # non vérifiée).
          export SIMCTL_CHILD_SMOKE_TEST_MODE=1
          xcrun simctl launch "$DEVICE_UDID" "$BUILT_BUNDLE_ID"
          LAUNCH_EXIT=$?
          echo "xcrun simctl launch exit code : $LAUNCH_EXIT"
          if [ "$LAUNCH_EXIT" -ne 0 ]; then
            echo "ERREUR : xcrun simctl launch a retourné un code non nul — l'app n'a probablement jamais démarré."
          fi

          # Fenêtre de 8s pour laisser un éventuel crash au démarrage apparaître dans le stream de
          # logs avant de l'arrêter (pas une preuve d'absence de crash si rien n'apparaît — voir
          # aussi la recherche de rapports .ips/.crash ci-dessous, complémentaire).
          sleep 8
          kill "$LOG_PID" 2>/dev/null || true
          wait "$LOG_PID" 2>/dev/null || true

          echo "--- Logs système filtrés sur le process $BUILT_EXECUTABLE (8s après launch) ---"
          cat "$LOG_FILE" 2>/dev/null || echo "(fichier de logs vide ou introuvable)"

          CRASH_FILE="$SCREENSHOT_DIR/crash_reports.txt"
          : > "$CRASH_FILE"
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          echo "--- Recherche de rapports de crash récents pour $BUILT_EXECUTABLE dans $CRASH_DIR ---"
          if [ -d "$CRASH_DIR" ]; then
            RECENT_CRASHES=$(find "$CRASH_DIR" \( -iname "${BUILT_EXECUTABLE}*.ips" -o -iname "${BUILT_EXECUTABLE}*.crash" \) -mmin -10)
            if [ -n "$RECENT_CRASHES" ]; then
              echo "Rapport(s) de crash trouvé(s) — copiés dans $CRASH_FILE :"
              for f in $RECENT_CRASHES; do
                echo "===== $f =====" | tee -a "$CRASH_FILE"
                cat "$f" | tee -a "$CRASH_FILE"
              done
            else
              echo "Aucun rapport .ips/.crash récent pour $BUILT_EXECUTABLE dans $CRASH_DIR." | tee -a "$CRASH_FILE"
            fi
          else
            echo "$CRASH_DIR introuvable sur ce runner." | tee -a "$CRASH_FILE"
          fi

      - name: Capturer une série de captures d'écran (lancement → premier écran réel de l'app)
        script: |
          # Chemin ABSOLU explicite, dérivé de $CM_BUILD_DIR (racine du clone — confirmé par la
          # documentation Codemagic : "the global working directory defaults to the directory where
          # the repository is cloned"/"All paths are relative to the clone directory"), utilisé
          # IDENTIQUE ici et dans `artifacts:` ci-dessous — élimine toute ambiguïté sur le
          # répertoire de travail réel au moment de la capture vs celui utilisé pour la collecte
          # des artifacts par Codemagic.
          SCREENSHOT_DIR="$CM_BUILD_DIR/smoke_test_screenshots"
          mkdir -p "$SCREENSHOT_DIR"
          echo "Dossier de captures : $SCREENSHOT_DIR"

          # 2026-08-13 (suite) : la boîte de dialogue système de permission notifications, atteinte
          # sans crash pour la première fois de ce portage, était bloquante pour la suite (voir
          # `SMOKE_TEST_MODE=1`, exporté avant `xcrun simctl launch` dans l'étape précédente, lu par
          # `App/AppDelegate.swift` pour sauter la demande d'autorisation) — plus de boîte de
          # dialogue à "passer" par un tap, elle n'apparaît plus du tout dans ce workflow. Les 2
          # phases de capture ci-dessous restent utiles pour autre chose : documenter la transition
          # ENTRE l'écran de lancement (`UILaunchScreen`) et le premier écran réel de l'app, qui
          # peut nécessiter un peu plus de temps (routage racine, vérification d'état de connexion)
          # maintenant que la boîte de dialogue ne bloque plus artificiellement ce chargement.

          # Phase 1 ("lancement_") : même délai qu'avant (10s, cause déjà documentée : cold start +
          # init Firebase/Core Data), 3 captures rapprochées pour documenter l'état juste après le
          # lancement.
          sleep 10
          for i in $(seq -w 1 3); do
            xcrun simctl io "$DEVICE_UDID" screenshot "$SCREENSHOT_DIR/lancement_${i}.png"
            sleep 2
          done

          # Phase 2 ("ecran_") : attente supplémentaire pour laisser le premier écran réel de
          # l'app (connexion/onboarding attendu, d'après `RootRouterView.swift`) se charger
          # complètement, puis 5 captures pour documenter son état stabilisé.
          sleep 5
          for i in $(seq -w 1 5); do
            xcrun simctl io "$DEVICE_UDID" screenshot "$SCREENSHOT_DIR/ecran_${i}.png"
            sleep 2
          done

          echo "--- Contenu réel de $SCREENSHOT_DIR après capture ---"
          ls -la "$SCREENSHOT_DIR"

          # Vérification explicite plutôt qu'un simple `ls` informatif : si `xcrun simctl io
          # screenshot` a échoué silencieusement pour chaque itération (code de sortie 0 mais
          # fichier non produit — pas observé mais pas exclu non plus, jamais vérifié en pratique
          # depuis cet environnement), ce step doit échouer BRUYAMMENT ici plutôt que de laisser la
          # section Artifacts silencieusement vide/absente sur la page du build, comme constaté.
          PNG_COUNT=$(find "$SCREENSHOT_DIR" -maxdepth 1 -name "*.png" | wc -l | tr -d ' ')
          echo "Nombre de captures .png trouvées : $PNG_COUNT"
          if [ "$PNG_COUNT" -eq 0 ]; then
            echo "ERREUR : aucune capture .png dans $SCREENSHOT_DIR — le workflow échoue ici explicitement au lieu de produire un build vert sans artifact."
            exit 1
          fi

    artifacts:
      # Chemin ABSOLU identique à $SCREENSHOT_DIR ci-dessus (variables d'environnement supportées
      # dans les patterns `artifacts:`, confirmé par la documentation Codemagic) — publié
      # automatiquement comme artifacts téléchargeables du build, aucune section `publishing:`
      # nécessaire pour cela.
      - $CM_BUILD_DIR/smoke_test_screenshots/*.png
      # Diagnostic ajouté 2026-08-13 (log système filtré + rapports de crash éventuels) — exportés
      # en artifacts pour lecture directe depuis la page du build, sans avoir à rouvrir la console
      # de logs complète de l'étape "Démarrer le simulateur, installer et lancer l'app".
      - $CM_BUILD_DIR/smoke_test_screenshots/simulator_log.txt
      - $CM_BUILD_DIR/smoke_test_screenshots/crash_reports.txt

    # Volontairement AUCUNE section `publishing:` (pas de TestFlight/App Store Connect) — ce
    # workflow ne fait QUE de la capture d'écran diagnostique sur simulateur, voir avertissement de
    # tête de workflow. Ne remplace PAS "CHECKPOINT 3 ATTEINT ET VALIDÉ" (compilation) ni un futur
    # test manuel réel sur device — voir "État réel du projet" dans MIGRATION_PROGRESS.md.
