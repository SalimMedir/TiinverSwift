name: TiinverSwift
options:
  bundleIdPrefix: com.tiinver
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: 5.9.0
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: 16.1.0
  MetalPetal:
    url: https://github.com/MetalPetal/MetalPetal.git
    from: 1.10.0
  Gifu:
    url: https://github.com/kaishin/Gifu.git
    from: 3.4.1
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    # Checkpoint 3 : `from: 11.0.0` provoquait 11 erreurs "cannot find type in scope"
    # (BannerView/RewardedAd/RewardedInterstitialAd/NativeAd/AdLoader/NativeAdLoaderDelegate).
    # Cause CONFIRMÉE (pas supposée) par lecture des notes de version Google ET du
    # `project.pbxproj` réel de l'exemple officiel `googleads-mobile-ios-examples` (SwiftUIDemo,
    # `XCRemoteSwiftPackageReference` → `minimumVersion = 13.0.0`) : la nomenclature Swift SANS
    # préfixe `GAD*` n'existe qu'à partir du SDK 12.0.0 ("Updated Swift API names to follow the
    # naming conventions from Apple's Swift API Design Guidelines", notes de version Google) —
    # `from: 11.0.0` (sémantique SPM `upToNextMajor`) restait borné à la branche 11.x, qui n'a
    # jamais ces types. Même famille de bug que FirebaseCore au Checkpoint 1 : la résolution de
    # dépendances réussit silencieusement (11.x existe) mais la version résolue n'a pas l'API
    # attendue. Aligné sur la contrainte de l'exemple officiel plutôt que deviné.
    from: 13.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 7.1.0
  FBSDK:
    url: https://github.com/facebook/facebook-ios-sdk.git
    from: 17.0.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 125.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.15.0
  TOCropViewController:
    # Module 9 (Éditeur photo simple) — remplace le recadreur vendorisé Android
    # (`android/croper/CropImageView.java`+`CropOverlayView.java`+`CropWindowHandler.java`+
    # `CropWindowMoveHandler.java`, ~5000 lignes de géométrie de poignées tactiles) par une
    # bibliothèque iOS native équivalente. Vérifié avant choix (pas deviné) : `pushed_at` très
    # récent, non archivé, `Package.swift` réel confirme `platforms: [.iOS(.v12)]` (compatible
    # `deploymentTarget.iOS = "16.0"`) — voir MIGRATION_PROGRESS.md, décision module 9.
    url: https://github.com/TimOliver/TOCropViewController.git
    from: 3.2.0

targets:
  TiinverSwift:
    type: application
    platform: iOS
    sources:
      - path: Sources/TiinverSwift
    resources:
      # `path: Resources` seul (sans `type:`) donne à XcodeGen le type par défaut pour un dossier
      # sans extension, `group` — chaque fichier À L'INTÉRIEUR est bien ajouté individuellement à
      # la phase "Copy Bundle Resources" (finit à la racine du bundle, pas dans un sous-dossier —
      # contrairement à `type: folder`/`syncedFolder`, qui préserverait la hiérarchie).
      - path: Resources
        excludes:
          # GoogleService-Info.plist reste EXCLU ici en permanence, PAR CONCEPTION (pas pour éviter
          # une double inclusion avec une entrée `resources:` dédiée — cette approche a été
          # ABANDONNÉE, voir `postBuildScripts:` ci-dessous). Cause confirmée par preuve directe
          # (build Codemagic `6a7d8cb7ab6f0602d098a8f7`, 2026-08-13) : XcodeGen exclut de TOUTE
          # phase de build tout fichier dont le nom correspond au motif suffixe `*-Info.plist` (PR
          # #945/issue #1045 du dépôt XcodeGen — voir commentaire détaillé sur `postBuildScripts:`
          # ci-dessous), y compris via `buildPhase: resources` explicite sur une entrée dédiée
          # (testé, confirmé insuffisant par ce même build — 0 occurrence de "GoogleService-Info"
          # dans `project.pbxproj` malgré cette option). Ce fichier ne passe donc plus DU TOUT par
          # le système `resources:`/`sources:` de XcodeGen — copié directement dans le bundle
          # construit par un script shell, voir `postBuildScripts:`.
          - "GoogleService-Info.plist"
          # RemoteConfigDefaults.plist — même symptôme, cause DIFFÉRENTE de GoogleService-Info.plist
          # (2026-08-13) : confirmé par preuve directe (log runtime, `Bundle.main` "Request:
          # RemoteConfigDefaults type: plist → Result: None") que ce fichier, bien que présent sur
          # le disque de build, n'atterrissait PAS dans le bundle `.app` via ce dossier `Resources`
          # — CE fichier ne correspond PAS au motif `*-Info.plist` (donc pas la même cause que
          # GoogleService-Info.plist), mais le résultat empirique est identique : absent du bundle.
          # Plutôt que d'ouvrir une nouvelle investigation approfondie pour un 2ᵉ fichier avec le
          # même symptôme (le système `resources:`/`sources:` de XcodeGen s'est déjà montré peu
          # fiable pour de la personnalisation fine de bundle sur ce projet, voir aussi
          # `CFBundleVersion`/`Info.plist`), même contournement appliqué directement : copié par le
          # même script `postBuildScripts:` ci-dessous, hors du système resources de XcodeGen.
          - "RemoteConfigDefaults.plist"
    # CONTOURNEMENT COMPLET du système resources: de XcodeGen pour GoogleService-Info.plist
    # (2026-08-13, 4ᵉ tentative — 3 précédentes insuffisantes, voir le commentaire `excludes:`
    # ci-dessus et MIGRATION_PROGRESS.md pour l'historique complet) : XcodeGen exclut
    # catégoriquement tout fichier `*-Info.plist` de toute build phase générée (`Docs/
    # ProjectSpec.md` réel : "Info.plist files will never be added to any build phases, no matter
    # what this setting is" — confirmé s'appliquer aussi à `buildPhase: resources` explicite par un
    # build réel, pas seulement par la doc). Plutôt que de continuer à chercher une déclaration
    # `resources:`/`sources:` qui échapperait à cette règle catégorique, ce fichier n'est plus
    # DU TOUT référencé dans le `.xcodeproj` généré — copié directement dans le bundle `.app` DÉJÀ
    # CONSTRUIT par un script shell exécuté PENDANT le build Xcode lui-même, hors du système de
    # resources de XcodeGen entièrement.
    # `postBuildScripts:` (PAS `postCompileScripts:`, qui s'exécute après Compile Sources mais
    # AVANT les autres phases) choisi précisément parce qu'il s'exécute "after any other build
    # phases" (vérifié contre `Docs/ProjectSpec.md` réel de XcodeGen, pas deviné) — garantit que le
    # bundle `.app` (`${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}`) existe déjà au moment de la copie.
    # `SRCROOT`/`BUILT_PRODUCTS_DIR`/`WRAPPER_NAME` : variables de build Xcode standard (pas
    # spécifiques à XcodeGen) — `SRCROOT` = dossier contenant le `.xcodeproj` généré (racine du
    # clone, où `Resources/GoogleService-Info.plist` est décodé par `codemagic.yaml` avant
    # `xcodegen generate`) ; `WRAPPER_NAME` = nom complet du bundle avec extension
    # (`TiinverSwift.app`).
    # Ne fait PAS échouer le build si le fichier source est absent (`|| echo ...` plutôt que
    # `exit 1`) — délibéré, comme `optional: true` pour la même raison ailleurs dans ce fichier :
    # ce fichier est un secret non committé (voir `.gitignore`), un échec dur bloquerait toute
    # génération/build LOCAL sur une machine où il n'a jamais été décodé, pas seulement le cas
    # d'erreur réel qu'on veut détecter. `inputFiles:`/`outputFiles:` déclarés explicitement pour
    # que le système de build (analyse de dépendances incrémentale) sache que cette phase produit
    # réellement ce fichier, et la relance si la source change — pas strictement nécessaire pour des
    # builds CI toujours propres (`git clone` frais à chaque run), mais correct pour un usage Xcode
    # local incrémental.
    postBuildScripts:
      - name: Copier GoogleService-Info.plist dans le bundle (contournement de l'exclusion XcodeGen des fichiers *-Info.plist)
        script: |
          cp "${SRCROOT}/Resources/GoogleService-Info.plist" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/GoogleService-Info.plist" 2>/dev/null || echo "GoogleService-Info.plist non trouvé à la source — build continuera mais l'app crashera au lancement"
        inputFiles:
          - $(SRCROOT)/Resources/GoogleService-Info.plist
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/GoogleService-Info.plist
      # RemoteConfigDefaults.plist — script SÉPARÉ (pas fusionné dans le précédent), même modèle
      # exact, même raison (2026-08-13) : ce fichier n'atterrissait pas non plus dans le bundle via
      # `resources:`, symptôme identique à GoogleService-Info.plist mais cause distincte (pas le
      # motif `*-Info.plist`) — voir commentaire détaillé sur `resources: excludes:` ci-dessus. Sans
      # ce fichier, `TiinverFirebaseConfigManager.setDefaults(fromPlist:)` échoue silencieusement
      # (pas de crash), et les 3 clés `app_expire_day/month/year` retombent à `0` (comportement
      # standard Firebase pour une clé Remote Config jamais définie, ni par défaut ni par fetch) —
      # `DateComponents(year: 0, month: 0, day: 0)` produit alors une date extrêmement ancienne, PAS
      # `nil` (`Calendar.date(from:)` ne renvoie `nil` que si aucune date n'est calculable du tout,
      # ce qui n'est pas le cas ici), donc `Date() > expiryDate` (`RootRouterView.
      # checkForceUpdate()`) est TOUJOURS vrai — explique le blocage systématique observé sur
      # Appetize.io (où `SMOKE_TEST_MODE` n'est jamais injecté, contrairement au pipeline CI).
      - name: Copier RemoteConfigDefaults.plist dans le bundle (même contournement que GoogleService-Info.plist)
        script: |
          cp "${SRCROOT}/Resources/RemoteConfigDefaults.plist" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/RemoteConfigDefaults.plist" 2>/dev/null || echo "RemoteConfigDefaults.plist non trouvé à la source — build continuera mais la gate de mise à jour bloquera systématiquement au lancement"
        inputFiles:
          - $(SRCROOT)/Resources/RemoteConfigDefaults.plist
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/RemoteConfigDefaults.plist
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - voip
          - remote-notification
        # `CFBundleShortVersionString`/`CFBundleVersion` RETIRÉS d'ici (2026-08-13, cause réelle du
        # blocage "mise à jour requise" persistant sur Appetize.io malgré une tentative précédente
        # de fixer `CFBundleVersion: "1000"` juste ICI, dans `properties:` — sans AUCUN effet,
        # confirmé par l'utilisateur sur un build neuf). **Cause confirmée avec certitude, pas une
        # nouvelle estimation** : `Docs/ProjectSpec.md` réel de XcodeGen liste explicitement
        # `CFBundleShortVersionString` ET `CFBundleVersion` parmi les propriétés Info.plist
        # "generated automatically" par XcodeGen — CE QUI SIGNIFIE que toute valeur littérale
        # fournie ici, dans `properties:`, pour CES DEUX CLÉS PRÉCISES est IGNORÉE ; XcodeGen les
        # dérive plutôt des BUILD SETTINGS `CURRENT_PROJECT_VERSION`/`MARKETING_VERSION` (mapping
        # standard Xcode : `CURRENT_PROJECT_VERSION` → `CFBundleVersion`, `MARKETING_VERSION` →
        # `CFBundleShortVersionString`, confirmé par plusieurs sources indépendantes, pas une seule).
        # Aucun des deux n'était déclaré dans `settings: base:` ci-dessous jusqu'ici — Xcode
        # utilisait donc sa valeur par défaut implicite pour `CURRENT_PROJECT_VERSION` (`"1"`),
        # EXPLIQUANT EXACTEMENT pourquoi la tentative précédente ("1000" ici même) n'avait aucun
        # effet sur le `CFBundleVersion` RÉELLEMENT compilé dans le `.app`, lu par
        # `RootRouterView.checkForceUpdate()` via `Bundle.main.infoDictionary?["CFBundleVersion"]`
        # (ce code de LECTURE, lui, est correct — vérifié ligne par ligne, la clé et le type `Int`
        # sont bons ; le bug était entièrement côté ÉCRITURE, dans ce fichier). Valeurs déplacées
        # vers `settings: base:` ci-dessous, le mécanisme qui fonctionne RÉELLEMENT pour ces 2 clés.
        NSCameraUsageDescription: "Tiinver a besoin de la caméra pour publier des photos et vidéos."
        NSMicrophoneUsageDescription: "Tiinver a besoin du micro pour les vidéos, messages vocaux et appels."
        NSPhotoLibraryUsageDescription: "Tiinver a besoin d'accéder à vos photos pour publier du contenu."
        # Port de `ProfileFeedFragment.downloadFile` (V4-F-007, Phase B P0-3) — enregistrement d'un
        # média téléchargé (`PHPhotoLibrary.performChanges`, permission ÉCRITURE, distincte de la
        # lecture ci-dessus utilisée pour la publication).
        NSPhotoLibraryAddUsageDescription: "Tiinver a besoin d'enregistrer les photos et vidéos que vous téléchargez."
        NSContactsUsageDescription: "Tiinver utilise vos contacts pour vous suggérer des amis."
        # Module 16 (AdMob) — App ID CONFIRMÉ (pas deviné) : `AndroidManifest.xml:419`,
        # `ca-app-pub-2461482190230201~9045103625`, identique quelle que soit la plateforme (un
        # même compte AdMob héberge les unités pub Android ET iOS de la même app, confirmé par
        # TIINVER_IOS_PORT_ANALYSIS.md §5). Requis par le SDK au démarrage (`MobileAds.shared.
        # start()` échoue silencieusement sans cette clé, comportement documenté du SDK).
        GADApplicationIdentifier: "ca-app-pub-2461482190230201~9045103625"
        # Requis depuis iOS 14.5 pour toute app utilisant AdMob (App Tracking Transparency) —
        # AUCUN équivalent Android (permission runtime standard côté Android, pas de prompt système
        # dédié à la publicité). Le prompt réel (`ATTrackingManager.requestTrackingAuthorization`)
        # N'EST PAS câblé dans ce portage (voir tableau détaillé module 16) — cette clé Info.plist
        # est nécessaire même sans l'appel explicite, le SDK AdMob la lit pour son propre
        # fonctionnement en mode "non personnalisé" par défaut si l'app ne demande jamais la
        # permission.
        NSUserTrackingUsageDescription: "Cette identification sera utilisée pour vous proposer des publicités plus pertinentes."
        # Identifiant SKAdNetwork Google/AdMob PROPRE (documenté publiquement, stable, pas une
        # supposition) — SUFFISANT tant qu'AUCUN réseau de médiation n'est configuré côté console
        # AdMob (confirmé §5.6 : médiation = configuration console uniquement, zéro code
        # applicatif). **Si des réseaux de médiation sont activés plus tard côté console (Meta
        # Audience Network/Unity Ads/Pangle, comme sur Android), la liste COMPLÈTE des identifiants
        # SKAdNetwork de ces réseaux (publiée par Google, ~50+ entrées) devra être ajoutée ici —
        # PAS ajoutée par ce portage sans confirmation que la médiation sera réellement activée
        # côté iOS, pour ne pas fabriquer une liste non vérifiée.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        # Port des `<intent-filter>` de `AndroidManifest.xml` (deep links, audit dédié du
        # 2026-08-16 — iOS n'avait AUCUNE gestion de lien profond avant ce tour, confirmé par grep
        # exhaustif). `myapp` = schéma EXACT d'Android (`android:scheme="myapp"`,
        # `android:host="parrainage"`, lien de parrainage). `tiinver` = schéma PROPRE à ce portage
        # iOS, repli pour les liens `https://tiinver.com/{user,post,group,myaccount,animemes,
        # update,offer}/...` (`android:scheme="https" android:host="tiinver.com"`,
        # `android:autoVerify="true"`) : un VRAI "Universal Link" `https://` nécessiterait un
        # fichier `apple-app-site-association` hébergé côté serveur ET l'entitlement "Associated
        # Domains", NI L'UN NI L'AUTRE ne peut être ajouté/vérifié depuis ce dépôt Swift seul (pas
        # de contrôle sur le serveur `tiinver.com`) — voir `MIGRATION_AUDIT.md`. La logique de
        # ROUTAGE (`DeepLinkRouter.swift`) est cependant écrite pour fonctionner IDENTIQUEMENT via
        # les deux transports, dès qu'un AASA sera éventuellement hébergé.
        CFBundleURLTypes:
          - CFBundleURLName: com.tiinver.ios.deeplink
            CFBundleURLSchemes:
              - myapp
              - tiinver
    settings:
      base:
        # CONFIRMÉ (pas une supposition) par Resources/GoogleService-Info.plist, clé BUNDLE_ID
        # = "com.tiinver.ios" — fichier réel téléchargé par l'utilisateur depuis la console
        # Firebase pour l'app iOS du projet "com-tiinver". Corrige la valeur précédente
        # "com.tiinver.tiinverProject", qui n'était qu'une déduction indirecte depuis
        # app/google-services.json côté Android (un identifiant d'app invite secondaire, pas le
        # vrai bundle id de l'app iOS principale) — voir décision "GoogleService-Info.plist
        # intégré" du 2026-08-10 dans MIGRATION_PROGRESS.md.
        PRODUCT_BUNDLE_IDENTIFIER: com.tiinver.ios
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: false
        # 2026-08-13 (suite) — CETTE TENTATIVE SEULE S'EST AVÉRÉE INSUFFISANTE, confirmé par preuve
        # directe (Info.plist extrait d'un `.app` téléchargé via plistlib, `CFBundleVersion`
        # toujours "1" malgré ces réglages). Cause réelle trouvée dans le CODE SOURCE de XcodeGen
        # (`Sources/XcodeGenKit/InfoPlistGenerator.swift`, récupéré directement) :
        # `generateDefaultInfoPlist(for:)` code en dur `dictionary["CFBundleVersion"] = "1"` et
        # `dictionary["CFBundleShortVersionString"] = "1.0"` — ni `properties:` (1ʳᵉ tentative) ni
        # CES build settings (2ᵉ tentative) ne changent la valeur ÉCRITE dans le `Info.plist` généré
        # pour ces 2 clés précises. **Ces 2 réglages sont CONSERVÉS ici** (harmless, potentiellement
        # utiles pour `agvtool`/cohérence de build settings à l'avenir) **mais NE SONT PLUS LE
        # MÉCANISME QUI FAIT RÉELLEMENT FONCTIONNER LA CORRECTION** — voir `codemagic.yaml`, étape
        # "Forcer CFBundleVersion/CFBundleShortVersionString dans Info.plist (contournement
        # XcodeGen)" : édition directe du `Info.plist` généré via `PlistBuddy`, APRÈS `xcodegen
        # generate` et AVANT `xcodebuild build`, même stratégie de contournement que pour
        # `GoogleService-Info.plist` (XcodeGen s'est avéré, à plusieurs reprises cette session, peu
        # fiable pour ce genre de personnalisation fine d'`Info.plist`). TEMPORAIRE : "1000"/"1.0.0"
        # à remettre à une valeur réelle cohérente avant soumission App Store — voir
        # MIGRATION_PROGRESS.md pour l'historique complet de cette investigation.
        CURRENT_PROJECT_VERSION: "1000"
        MARKETING_VERSION: "1.0.0"
    dependencies:
      - package: Alamofire
      - package: SocketIO
      - package: MetalPetal
      - package: Gifu
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleSignIn
      - package: FBSDK
        product: FacebookLogin
      - package: FBSDK
        product: FacebookCore
      - package: WebRTC
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAnalytics
      # Port de `app/build.gradle` (plugin `com.google.firebase.crashlytics` + dépendance NDK,
      # 2026-08-16, audit transversal final) — trouvé RÉELLEMENT actif côté Android (plugin déclaré,
      # PAS du code mort) mais AUCUN appelant manuel (`FirebaseCrashlytics.getInstance()`/
      # `recordException`) nulle part dans le code source Android : collecte 100% automatique des
      # crashs, aucune logique métier à reproduire. `FirebaseApp.configure()` (déjà appelé,
      # `AppDelegate.swift`) suffit à initialiser la collecte automatique une fois ce produit lié,
      # même mécanisme "zéro-code" que le plugin Gradle. **Limite assumée** : PAS de phase de build
      # dédiée à l'upload des dSYM (symbolication) — ce projet a un historique documenté de
      # `postBuildScripts`/`resources:` XcodeGen fragiles (voir commentaires `excludes:` plus haut,
      # 4 tentatives pour `GoogleService-Info.plist`) ; ajouter un script d'upload dSYM non
      # vérifiable sans environnement Xcode local risquerait de casser un CI par ailleurs vert pour
      # un gain (rapports lisibles vs juste collectés) non bloquant. Les rapports de crash seront
      # collectés dès ce commit, la symbolication (dSYM) reste un suivi possible avec accès à un
      # vrai run Xcode/Codemagic pour vérifier le script avant de l'ajouter.
      - package: Firebase
        product: FirebaseCrashlytics
      - package: TOCropViewController
        product: CropViewController
