name: TiinverSwift
options:
  bundleIdPrefix: com.tiinver
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: 5.9.0
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: 16.1.0
  MetalPetal:
    url: https://github.com/MetalPetal/MetalPetal.git
    from: 1.10.0
  Gifu:
    url: https://github.com/kaishin/Gifu.git
    from: 3.4.1
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    # Checkpoint 3 : `from: 11.0.0` provoquait 11 erreurs "cannot find type in scope"
    # (BannerView/RewardedAd/RewardedInterstitialAd/NativeAd/AdLoader/NativeAdLoaderDelegate).
    # Cause CONFIRMÉE (pas supposée) par lecture des notes de version Google ET du
    # `project.pbxproj` réel de l'exemple officiel `googleads-mobile-ios-examples` (SwiftUIDemo,
    # `XCRemoteSwiftPackageReference` → `minimumVersion = 13.0.0`) : la nomenclature Swift SANS
    # préfixe `GAD*` n'existe qu'à partir du SDK 12.0.0 ("Updated Swift API names to follow the
    # naming conventions from Apple's Swift API Design Guidelines", notes de version Google) —
    # `from: 11.0.0` (sémantique SPM `upToNextMajor`) restait borné à la branche 11.x, qui n'a
    # jamais ces types. Même famille de bug que FirebaseCore au Checkpoint 1 : la résolution de
    # dépendances réussit silencieusement (11.x existe) mais la version résolue n'a pas l'API
    # attendue. Aligné sur la contrainte de l'exemple officiel plutôt que deviné.
    from: 13.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 7.1.0
  FBSDK:
    url: https://github.com/facebook/facebook-ios-sdk.git
    from: 17.0.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 125.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.15.0
  TOCropViewController:
    # Module 9 (Éditeur photo simple) — remplace le recadreur vendorisé Android
    # (`android/croper/CropImageView.java`+`CropOverlayView.java`+`CropWindowHandler.java`+
    # `CropWindowMoveHandler.java`, ~5000 lignes de géométrie de poignées tactiles) par une
    # bibliothèque iOS native équivalente. Vérifié avant choix (pas deviné) : `pushed_at` très
    # récent, non archivé, `Package.swift` réel confirme `platforms: [.iOS(.v12)]` (compatible
    # `deploymentTarget.iOS = "16.0"`) — voir MIGRATION_PROGRESS.md, décision module 9.
    url: https://github.com/TimOliver/TOCropViewController.git
    from: 3.2.0

targets:
  TiinverSwift:
    type: application
    platform: iOS
    sources:
      - path: Sources/TiinverSwift
    resources:
      # `path: Resources` seul (sans `type:`) donne à XcodeGen le type par défaut pour un dossier
      # sans extension, `group` — chaque fichier À L'INTÉRIEUR est bien ajouté individuellement à
      # la phase "Copy Bundle Resources" (donc censé finir à la racine du bundle, pas dans un
      # sous-dossier — contrairement à `type: folder`/`syncedFolder`, qui préserverait la
      # hiérarchie). **Bug confirmé au premier lancement réel (2026-08-13, `visual-smoke-test`,
      # log système : `FirebaseApp.configure()` plante, "Request: GoogleService-Info type: plist →
      # Result: None")** : malgré cette déclaration, ce fichier précis ne se retrouvait PAS dans le
      # bundle `.app` construit — mécanisme exact non confirmable avec certitude depuis cet
      # environnement (pas d'accès à un `xcodebuild`/`.xcodeproj` réel pour l'inspecter), corrigé
      # ci-dessous par une entrée dédiée plutôt que de re-deviner le comportement interne exact de
      # XcodeGen pour ce cas précis.
      - path: Resources
        excludes:
          # Évite une double inclusion (donc une erreur Xcode "Multiple commands produce
          # GoogleService-Info.plist") avec l'entrée dédiée ci-dessous.
          - "GoogleService-Info.plist"
      # Entrée dédiée, EXPLICITE : `type: file` est le défaut XcodeGen pour un chemin de fichier
      # avec extension (vérifié contre `Docs/ProjectSpec.md` réel du dépôt XcodeGen, pas deviné) —
      # garantit une référence de fichier individuelle avec sa propre entrée "Copy Bundle
      # Resources", sans dépendre du comportement d'inclusion en masse du dossier parent.
      # `optional: true` REQUIS : ce fichier n'est PAS committé (secret, voir `.gitignore` et
      # `GOOGLE_SERVICE_INFO_PLIST_BASE64`) — sans cette option, `xcodegen generate` échouerait sur
      # toute machine où le fichier n'a pas encore été décodé (vérifié contre la doc XcodeGen
      # réelle : "Disable missing path check. Defaults to false" — sans elle, un chemin de fichier
      # absent fait échouer `xcodegen generate` immédiatement, pas seulement produire un bundle
      # incomplet).
      - path: Resources/GoogleService-Info.plist
        optional: true
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - voip
          - remote-notification
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Tiinver a besoin de la caméra pour publier des photos et vidéos."
        NSMicrophoneUsageDescription: "Tiinver a besoin du micro pour les vidéos, messages vocaux et appels."
        NSPhotoLibraryUsageDescription: "Tiinver a besoin d'accéder à vos photos pour publier du contenu."
        NSContactsUsageDescription: "Tiinver utilise vos contacts pour vous suggérer des amis."
        # Module 16 (AdMob) — App ID CONFIRMÉ (pas deviné) : `AndroidManifest.xml:419`,
        # `ca-app-pub-2461482190230201~9045103625`, identique quelle que soit la plateforme (un
        # même compte AdMob héberge les unités pub Android ET iOS de la même app, confirmé par
        # TIINVER_IOS_PORT_ANALYSIS.md §5). Requis par le SDK au démarrage (`MobileAds.shared.
        # start()` échoue silencieusement sans cette clé, comportement documenté du SDK).
        GADApplicationIdentifier: "ca-app-pub-2461482190230201~9045103625"
        # Requis depuis iOS 14.5 pour toute app utilisant AdMob (App Tracking Transparency) —
        # AUCUN équivalent Android (permission runtime standard côté Android, pas de prompt système
        # dédié à la publicité). Le prompt réel (`ATTrackingManager.requestTrackingAuthorization`)
        # N'EST PAS câblé dans ce portage (voir tableau détaillé module 16) — cette clé Info.plist
        # est nécessaire même sans l'appel explicite, le SDK AdMob la lit pour son propre
        # fonctionnement en mode "non personnalisé" par défaut si l'app ne demande jamais la
        # permission.
        NSUserTrackingUsageDescription: "Cette identification sera utilisée pour vous proposer des publicités plus pertinentes."
        # Identifiant SKAdNetwork Google/AdMob PROPRE (documenté publiquement, stable, pas une
        # supposition) — SUFFISANT tant qu'AUCUN réseau de médiation n'est configuré côté console
        # AdMob (confirmé §5.6 : médiation = configuration console uniquement, zéro code
        # applicatif). **Si des réseaux de médiation sont activés plus tard côté console (Meta
        # Audience Network/Unity Ads/Pangle, comme sur Android), la liste COMPLÈTE des identifiants
        # SKAdNetwork de ces réseaux (publiée par Google, ~50+ entrées) devra être ajoutée ici —
        # PAS ajoutée par ce portage sans confirmation que la médiation sera réellement activée
        # côté iOS, pour ne pas fabriquer une liste non vérifiée.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        # CONFIRMÉ (pas une supposition) par Resources/GoogleService-Info.plist, clé BUNDLE_ID
        # = "com.tiinver.ios" — fichier réel téléchargé par l'utilisateur depuis la console
        # Firebase pour l'app iOS du projet "com-tiinver". Corrige la valeur précédente
        # "com.tiinver.tiinverProject", qui n'était qu'une déduction indirecte depuis
        # app/google-services.json côté Android (un identifiant d'app invite secondaire, pas le
        # vrai bundle id de l'app iOS principale) — voir décision "GoogleService-Info.plist
        # intégré" du 2026-08-10 dans MIGRATION_PROGRESS.md.
        PRODUCT_BUNDLE_IDENTIFIER: com.tiinver.ios
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: false
    dependencies:
      - package: Alamofire
      - package: SocketIO
      - package: MetalPetal
      - package: Gifu
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleSignIn
      - package: FBSDK
        product: FacebookLogin
      - package: FBSDK
        product: FacebookCore
      - package: WebRTC
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAnalytics
      - package: TOCropViewController
        product: CropViewController
